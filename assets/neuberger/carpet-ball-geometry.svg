<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Carpet ball pit geometry, reconstructed</title>
  <desc id="desc">Inclined backboard from A at the left of the pit, bottom AB, vertical BC, tabletop to the right, and a ball rolling left toward C.</desc>
  <rect width="960" height="500" fill="#f8fafc"/>
  <path d="M140 410 L200 55 M140 410 H505 V155 H880" fill="none" stroke="#273449" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 410 A25 25 0 0 0 145 385" fill="none" stroke="#8c4b36" stroke-width="2.5"/>
  <circle cx="311" cy="374" r="36" fill="#a35369" stroke="#672f44" stroke-width="3"/>
  <circle cx="725" cy="119" r="36" fill="#a4b5ec" stroke="#576794" stroke-width="3"/>
  <path d="M665 119 H570" fill="none" stroke="#52627a" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M505 410 V155" fill="none" stroke="#273449" stroke-width="7"/>
  <path d="M484 410 V389 H505 M505 176 H526 V155" fill="none" stroke="#818d9d" stroke-width="2.5"/>
  <path d="M725 119 V155" fill="none" stroke="#68789f" stroke-width="2"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10" fill="#52627a"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="28" fill="#273449">
    <text x="108" y="440">A</text><text x="500" y="449">B</text><text x="485" y="139">C</text>
    <text x="300" y="453">l</text><text x="533" y="289">h1</text><text x="84" y="236">h2</text>
    <text x="173" y="390">θ</text><text x="737" y="140">r</text>
  </g>
</svg>
